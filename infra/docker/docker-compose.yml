# Development only: ports bound to localhost so the database is not reachable from the network.
services:
  postgres:
    image: postgres:16-alpine
    container_name: sitra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sitra
      POSTGRES_PASSWORD: sitra_dev_password
      POSTGRES_DB: sitra_ia
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - sitra_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sitra"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    container_name: sitra-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
volumes:
  sitra_pgdata:
