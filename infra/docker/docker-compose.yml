services:
  postgres:
    image: postgres:16-alpine
    container_name: sitra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sitra
      POSTGRES_PASSWORD: sitra_dev_password
      POSTGRES_DB: sitra_ia
    ports:
      - "5432:5432"
    volumes:
      - sitra_pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    container_name: sitra-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
volumes:
  sitra_pgdata:
