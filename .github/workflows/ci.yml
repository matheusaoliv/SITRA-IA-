name: SITRA IA CI
on:
  push:
    branches:
      - main
      - feature/process-management
      - feature/auth-rbac
  pull_request:
    branches:
      - main
      - feature/process-management
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run db:generate
      - run: npm run build --workspace @sitra/api
      - run: npm run build --workspace @sitra/web
