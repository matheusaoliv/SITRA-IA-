name: SITRA IA CI

on:
  push:
    branches:
      - main
      - feature/process-management
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Generate Prisma Client
        run: npm run db:generate
      - name: Build API
        run: npm run build --workspace @sitra/api
      - name: Build web
        run: npm run build --workspace @sitra/web
