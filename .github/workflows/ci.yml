name: SITRA IA CI

on:
  push:
    branches:
      - main
      - feature/process-management
      - feature/auth-rbac
  pull_request:
    branches:
      - main
      - feature/process-management
      - feature/auth-rbac
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sitra-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://sitra:sitra_ci_password@localhost:5432/sitra_ia?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Prisma schema
        run: npx prisma validate --schema database/prisma/schema.prisma

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Build API
        run: npm run build --workspace @sitra/api

      - name: Authorization policy tests
        run: node --test apps/api/dist/auth/authorization.policy.spec.js

      - name: Build web
        run: npm run build --workspace @sitra/web
